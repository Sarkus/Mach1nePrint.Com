<style id="css">
:root{--face:#ece9d8;--paper:#ffffee;--red:#800000;--ink:#000;--link:#0000ee;--peach:#ffe0d0;--ok:#006400;

.w{position:fixed;max-width:calc(100vw - 12px);border:3px solid #0831d9;border-top:0;border-radius:9px 9px 0 0;background:#0831d9;box-shadow:2px 4px 12px rgba(0,0,0,.45);overflow:hidden}
.w.hid{display:none}
.w.max{left:0!important;top:env(safe-area-inset-top,0px)!important;width:100vw!important;max-width:none;bottom:calc(36px + env(safe-area-inset-bottom,0px));border-radius:0}
.w.max .wb{max-height:none;height:calc(100% - 30px)}
.tb{background:linear-gradient(#0997ff,#0053ee 10%,#0050ee 85%,#0040d0);color:#fff;font-weight:bold;padding:4px 5px 4px 8px;display:flex;align-items:center;gap:6px;text-shadow:1px 1px #0f1089;border-radius:6px 6px 0 0;touch-action:none;cursor:default}
.tb .x{margin-left:auto;display:flex;gap:3px}
.tb i{font-style:normal;width:22px;height:22px;border:1px solid #fff;border-radius:3px;background:linear-gradient(135deg,#3c8bff,#0a4fd6);color:#fff;font-size:12px;line-height:20px;text-align:center;cursor:pointer;font-weight:bold;text-shadow:none}
.tb i[data-x]{background:linear-gradient(135deg,#f08a70,#c93a1c)}
.wb{background:var(--face);padding:8px;max-height:calc(100vh - 120px);overflow:auto}
.board{background:var(--paper);padding:10px;border:1px solid #7f9db9}
.head{text-align:center;margin-bottom:8px}
.head img{width:84px;height:84px;image-rendering:pixelated;border:2px solid #000}
.head h1{margin:4px 0 0;color:var(--red);font-size:32px;letter-spacing:-1px;font-family:Tahoma,Arial,sans-serif}
.phone{background:var(--red);color:#fff;font-weight:bold;padding:6px;text-align:center;margin:8px 0;overflow-wrap:anywhere}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.box{border:1px solid var(--red);margin:8px 0}
.box h2{margin:0;background:var(--red);color:#fff;font-size:15px;padding:3px 8px}

a{color:var(--link)}
input,select,textarea{font:inherit;width:100%;padding:4px;background:#fff;color:#000;border:1px solid #7f9db9;margin:2px 0 6px}
label{font-weight:bold;font-size:13px}
.line{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #aca899;padding:4px 0}
.adm{background:var(--peach);border:1px dashed var(--red);padding:8px;margin-top:10px}
.bignum{font-size:20px;font-weight:bold;text-align:center;background:var(--paper);color:var(--red);padding:12px 6px;margin:8px 0;overflow-wrap:anywhere;border:1px solid #7f9db9}
.xpbox{border:1px solid #7f9db9;background:#fff;margin:8px 0;color:#000}
.xpbox h3{margin:0;background:linear-gradient(90deg,#fff,#c6d3f7);padding:5px 8px;font-size:13px;color:#215dc6}
.spec{width:100%;border-collapse:collapse;font-size:13px}
.spec td,.spec th{border-bottom:1px dotted #aca899;padding:4px 8px;text-align:left;vertical-align:top}
.spec th{color:#0b3a9e}
.kv th{width:38%}
canvas{width:100%;max-width:520px;height:auto;touch-action:none;background:#fff;cursor:crosshair;display:block}
.pal{display:flex;flex-wrap:wrap;gap:2px;margin:4px 0;max-width:260px}
.pal i{width:20px;height:20px;border:1px solid #000;cursor:pointer}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:240px}
.calc button{padding:10px 0;font-size:16px}
.scr{max-width:240px;text-align:right;font:22px monospace;padding:6px;background:#fff;color:#000;margin-bottom:6px;overflow:hidden;border:1px solid #7f9db9}
.task{position:fixed;left:0;right:0;bottom:0;height:calc(36px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;gap:6px;align-items:stretch;z-index:9000;background:linear-gradient(#3168d5,#4993e6 8%,#245edb 20%,#245edb 90%,#1941a5)}
#start{background:linear-gradient(#5db35d,#3c9a3c 40%,#2e7d2e);color:#fff;font:italic bold 17px "Trebuchet MS",Tahoma,sans-serif;text-shadow:1px 1px 2px #1a4d1a;border:0;border-radius:0 14px 14px 0;padding:0 22px 0 12px;box-shadow:2px 0 4px rgba(0,0,0,.4);min-height:0}
#start:hover,#start:active{box-shadow:inset 0 0 0 2px #9be39b,2px 0 4px rgba(0,0,0,.4)}
#tbtns{display:flex;gap:3px;flex:1;min-width:0;overflow:hidden;padding:3px 0}
#tbtns button{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:linear-gradient(#4f8cf0,#3a78e0);border:1px solid #0a3aa8;color:#fff;border-radius:3px;min-height:0;padding:0 8px;box-shadow:none}
#tbtns button.on{background:linear-gradient(#1e4fbd,#2b62d1);box-shadow:inset 1px 1px 3px rgba(0,0,0,.5)}
.tray{display:flex;align-items:center;gap:8px;padding:0 10px;background:linear-gradient(#0f9ee8,#1288d4);border-left:1px solid #0a4aa0;color:#fff}
.tray button{min-height:24px;padding:0 8px}
#smenu{position:fixed;left:0;bottom:calc(36px + env(safe-area-inset-bottom,0px));display:none;z-index:9001;width:260px;max-height:calc(100vh - 80px);overflow:auto;border:2px solid #0831d9;border-radius:8px 8px 0 0;background:#fff;box-shadow:3px 3px 8px rgba(0,0,0,.5)}
#smenu.show{display:block}
#smenu .sh{background:linear-gradient(#1c5fd8,#0f48b5);color:#fff;font-weight:bold;font-size:15px;padding:10px;display:flex;align-items:center;gap:8px}
#smenu .sh img{width:32px;height:32px;image-rendering:pixelated;border:2px solid #fff;border-radius:4px}
#smenu button.mi{display:block;width:100%;text-align:left;border:0;border-radius:0;background:#fff;box-shadow:none;padding:9px 12px;color:#000}

#clip{position:fixed;right:10px;bottom:calc(46px + env(safe-area-inset-bottom,0px));z-index:9500;display:none;align-items:flex-end;gap:10px;max-width:calc(100vw - 20px)}
#clip.show{display:flex}
#clip .bub{background:#ffffe1;border:1px solid #000;border-radius:8px;padding:8px 10px;max-width:240px;font-size:13px;color:#000;box-shadow:2px 2px 4px rgba(0,0,0,.4);position:relative;margin-bottom:56px}
#clip .bub:before{content:"";position:absolute;right:-10px;bottom:16px;border:6px solid transparent;border-left:10px solid #000}
#clip .bub:after{content:"";position:absolute;right:-8px;bottom:17px;border:5px solid transparent;border-left:8px solid #ffffe1}
#clip img{width:96px;height:auto;flex:none;animation:cbob 1.6s ease-in-out infinite}
@keyframes cbob{50%{transform:translateY(-5px) rotate(-3deg)}}
@media (prefers-reduced-motion:reduce){#clip img{animation:none}}
#clip .cb{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}
#clip .cb button{min-height:26px;padding:2px 8px;font-size:12px}
#ss{position:fixed;inset:0;z-index:99999;background:#120a24;display:none}
#ss.show{display:block}
#ss canvas{width:100%;height:100%;max-width:none;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.ssh{position:absolute;left:12px;right:12px;color:#7cff7c;font:bold 13px/1.35 "Courier New",monospace;white-space:pre-wrap;text-shadow:0 0 6px #0f0,1px 1px #000;pointer-events:none}
.ssh.t{top:calc(10px + env(safe-area-inset-top,0px))}
.ssh.b{bottom:calc(10px + env(safe-area-inset-bottom,0px));color:#ff9bd8;text-shadow:0 0 6px #f0a,1px 1px #000}

@media (max-width:700px){
 .w,.w.max{left:0!important;right:0!important;top:env(safe-area-inset-top,0px)!important;bottom:calc(36px + env(safe-area-inset-bottom,0px))!important;width:100vw!important;max-width:none;border-radius:0;border-left-width:0;border-right-width:0}
 .w .wb{height:calc(100% - 30px);max-height:none;padding:8px 8px 30px;-webkit-overflow-scrolling:touch}
 .grid{grid-template-columns:repeat(2,1fr);gap:8px}
 .card .ph{height:120px}
 .card .t{font-size:14px}
 .card .a button{width:100%;min-height:40px;font-size:14px}
 .tabs button{min-height:38px}
 .head h1{font-size:26px}
 #clip .bub{max-width:190px}

}
</style>
</head>
<body>
<div id="icons" data-dyn></div>
<div id="ss" data-dyn></div>
<div id="clip" data-dyn></div>
<div id="wins" data-dyn></div>
<div id="smenu" class="raised" data-dyn></div>
<div class="task"><button id="start">🪟 inicio</button><div id="tbtns" data-dyn></div><div class="tray"><button data-app="cart">🛒 <span id="cn">0</span></button><span id="clk" data-dyn></span></div></div>


<script id="three3d" src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script id="app">
(function(){
var EMAIL="mach1neprintoficial@gmail.com",CLIPPY="clippy.png",LOGO="logo.png";
var SECS=[
{id:"info",name:"Información"},
{id:"figuras",name:"Figuras",d:"Figuras de anime y de personajes famosos de películas y series, pensadas para decorar y lucir en tu estante."},
{id:"armas",name:"Armas",d:"Armas para cosplay en escala 1:1, con detalles únicos para que tu disfraz se vea real."},
{id:"llaveros",name:"Llaveros",d:"Llaveros de todo tipo: personajes, objetos, nombres y lo que se te ocurra."},
{id:"comodidad",name:"Comodidad",d:"Soportes y accesorios útiles para el día a día: celulares, joysticks, auriculares y más."}];
function $(i){return document.getElementById(i)}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML}
function money(n){return "$"+Number(n).toLocaleString("es-AR")}
function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var prods=[];
var cart=ld("mp_cart_v1",{}),cur="info",isAdmin=false,z=10,n=0,top="",wins={},cname="",cnote="",lastLink="#",lastBody="";

/* ---------- ventanas ---------- */
function openWin(id,title,icon,html,w,after){
 if(wins[id]){wins[id].classList.remove("hid");front(id);return wins[id]}
 var el=document.createElement("div"),mob=innerWidth<700;n++;
 el.className="w raised";el.dataset.id=id;
 el.innerHTML='<div class="tb"><span>'+icon+' '+title+'</span><span class="x"><i data-min>_</i><i data-max>□</i><i data-x>×</i></span></div><div class="wb">'+html+'</div>';
 el.style.width=mob?"calc(100vw - 12px)":w+"px";
 el.style.left=mob?"6px":(110+(n%6)*26)+"px";
 el.style.top="calc(env(safe-area-inset-top,0px) + "+((mob?8:16)+(n%6)*(mob?8:26))+"px)";
 $("wins").appendChild(el);wins[id]=el;front(id);if(after)after(el);return el;
}
function front(id){if(!wins[id])return;wins[id].style.zIndex=++z;top=id;tbar()}
function closeWin(id){if(wins[id]){wins[id].remove();delete wins[id];if(top===id)top="";tbar()}}
function tbar(){
 var h="";for(var id in wins){var t=wins[id].querySelector(".tb span").textContent;h+='<button data-tb="'+id+'" class="'+(top===id&&!wins[id].classList.contains("hid")?"on":"")+'">'+esc(t)+'</button>'}
 $("tbtns").innerHTML=h;$("cn").textContent=cartCount();
}
document.addEventListener("pointerdown",function(e){
 var w=e.target.closest(".w");if(w&&top!==w.dataset.id)front(w.dataset.id);
 var tb=e.target.closest(".tb");if(!tb||e.target.closest("i")||innerWidth<700)return;
 var el=tb.parentNode;if(el.classList.contains("max"))return;
 var r=el.getBoundingClientRect(),dx=e.clientX-r.left,dy=e.clientY-r.top;
 function mv(ev){el.style.left=Math.max(0,ev.clientX-dx)+"px";el.style.top=Math.max(0,ev.clientY-dy)+"px"}
 function up(){removeEventListener("pointermove",mv);removeEventListener("pointerup",up)}
 addEventListener("pointermove",mv);addEventListener("pointerup",up);
});

/* ---------- tienda ---------- */
function cartCount(){var c=0;for(var k in cart)c+=cart[k];return c}
function cartItems(){var a=[];for(var id in cart){var p=prods.filter(function(x){return x.id===id})[0];if(p)a.push({p:p,q:cart[id]})}return a}
function openStore(){openWin("store","Mach1ne Print - Tienda","💀","",780);wins.store.classList.remove("hid");renderStore();front("store")}
function renderStore(){
 var el=wins.store;if(!el)return;
 var h='<div class="board"><div class="head"><img src="'+LOGO+'" alt="Mach1ne Print"><h1>Mach1ne Print</h1><small>/3d/ - Impresiones 3D hechas a pedido</small></div>'+
 '<div class="phone">✉️ Pedidos por correo: '+EMAIL+'</div><div class="tabs">';
 SECS.forEach(function(s){h+='<button data-sec="'+s.id+'" class="'+(cur===s.id?"on":"")+'">'+s.name+'</button>'});
 h+='<button data-app="cart">🛒 Carrito ('+cartCount()+')</button></div>';
 if(cur==="info"){
  h+='<div class="box"><h2>¿Qué es Mach1ne Print?</h2><div class="in">Somos un emprendimiento de impresión 3D. Hacemos figuras, armas para cosplay, llaveros y accesorios de comodidad. Todo se imprime a pedido, simple y funcional.</div></div>'+
  '<div class="box"><h2>Secciones</h2><div class="in">'+SECS.slice(1).map(function(s){return '<p style="margin:4px 0"><b>'+s.name+':</b> '+esc(s.d)+'</p>'}).join("")+'</div></div>'+
  '<div class="box"><h2>¿Cómo comprar?</h2><div class="in"><ol style="margin:0;padding-left:20px"><li>Elegí tus productos y agregalos al carrito.</li><li>Abrí el carrito, poné tu nombre y tocá “Finalizar compra”.</li><li>Te mostramos el pedido ya redactado para enviarlo por correo a '+EMAIL+'.</li><li>Coordinamos pago y entrega por ahí.</li></ol></div></div>'+
  '<div class="box"><h2>Escritorio</h2><div class="in">Los íconos del escritorio funcionan: Paint, Bloc de notas y Calculadora. Probalos mientras esperás tu pedido.</div></div>';
 }else{
  var s=SECS.filter(function(x){return x.id===cur})[0],list=prods.filter(function(p){return p.cat===cur});
  h+='<div class="box"><h2>/'+s.id+'/ - '+s.name+'</h2><div class="in">'+esc(s.d)+'</div></div><div class="grid">';
  if(!list.length)h+='<p>Todavía no hay productos en esta sección.</p>';
  list.forEach(function(p){h+='<div class="card"><div class="ph">'+(p.img?'<img src="'+p.img+'" alt="">':'[ sin foto ]')+'</div><div class="t"><b>'+esc(p.name)+'</b><br><span class="price">'+money(p.price)+'</span><br><small>'+esc(p.desc)+'</small></div><div class="a"><button data-add="'+p.id+'">Agregar al carrito</button>'+'</div></div>'});
  h+='</div>';
 }
 var wb=el.querySelector(".wb"),st=wb.scrollTop;wb.innerHTML=h+'</div>';wb.scrollTop=st;tbar();
}

/* ---------- carrito y compra ---------- */
function openCart(){openWin("cart","Carrito de compras","🛒","",430);wins.cart.classList.remove("hid");renderCart();front("cart")}
function renderCart(){
 var el=wins.cart;if(!el)return;var it=cartItems(),tot=0,h="";
 if(!it.length)h='<p>El carrito está vacío. Agregá productos desde la tienda.</p>';
 else{
  it.forEach(function(i){tot+=i.p.price*i.q;h+='<div class="line"><span>'+i.q+' × '+esc(i.p.name)+'</span><span>'+money(i.p.price*i.q)+' <button data-rm="'+i.p.id+'" style="padding:0 6px">−</button></span></div>'});
  h+='<p><b>Total: '+money(tot)+'</b></p><label>Tu nombre</label><input id="cname" value="'+esc(cname).replace(/"/g,"&quot;")+'"><label>Notas (opcional)</label><input id="cnote" value="'+esc(cnote).replace(/"/g,"&quot;")+'"><button data-act="checkout"><b>Finalizar compra</b></button><p><small>Después te mostramos el correo '+EMAIL+' con tu pedido ya redactado.</small></p>';
 }
 el.querySelector(".wb").innerHTML=h;tbar();if(wins.store)renderStore();
}
function checkout(){
 var it=cartItems();if(!it.length)return;if(!cname.trim()){alert("Poné tu nombre para armar el pedido");return}
 var tot=0,m="Hola Mach1ne Print! Quiero hacer este pedido:\n";
 it.forEach(function(i){tot+=i.p.price*i.q;m+="- "+i.q+" x "+i.p.name+" ("+money(i.p.price*i.q)+")\n"});
 m+="Total: "+money(tot)+"\nNombre: "+cname.trim();if(cnote.trim())m+="\nNotas: "+cnote.trim();
 lastBody=m;lastLink="mailto:"+EMAIL+"?subject="+encodeURIComponent("Pedido Mach1ne Print - "+cname.trim())+"&body="+encodeURIComponent(m);
 var nm=cname.trim();cart={};sv("mp_cart_v1",cart);closeWin("cart");
 openWin("done","¡Pedido listo!","✅",contactHtml('<p><b>¡Gracias, '+esc(nm)+'!</b> Tu pedido quedó armado. Enviá el pedido por correo a esta dirección para confirmarlo:</p>',true),420);
 if(wins.store)renderStore();tbar();
}
function contactHtml(intro,order){
 var gm="https://mail.google.com/mail/?view=cm&to="+EMAIL+(order?"&su="+encodeURIComponent("Pedido Mach1ne Print")+"&body="+encodeURIComponent(lastBody):"");
 gm=gm.replace(/&/g,"&amp;");
 return intro+'<div class="bignum">✉️ '+EMAIL+'</div><p style="text-align:center">'+(order?'<a class="btn" href="'+lastLink+'" target="_blank" rel="noopener"><b>Enviar pedido (app de correo)</b></a> ':'<a class="btn" href="mailto:'+EMAIL+'" target="_blank" rel="noopener">Escribir un correo</a> ')+'<a class="btn" href="'+gm+'" target="_blank" rel="noopener">Abrir en Gmail</a> <button data-act="copy">Copiar correo</button>'+(order?' <button data-act="copyorder">Copiar pedido</button>':'')+'</p>';
}

/* ---------- apps ---------- */
function openPaint(){
 var cols=["#000000","#808080","#800000","#808000","#008000","#008080","#000080","#800080","#ffffff","#c0c0c0","#ff0000","#ffff00","#00ff00","#00ffff","#0000ff","#ff00ff"];
 openWin("paint","Paint","🎨",'<div><button data-pt="pen" class="on">✏️ Lápiz</button> <button data-pt="eraser">🧽 Borrador</button> <select id="psz" style="width:auto"><option value="2">Fino</option><option value="5" selected>Medio</option><option value="10">Grueso</option></select> <button data-pa="clear">Limpiar</button> <button data-pa="save">Guardar PNG</button></div><div class="pal">'+cols.map(function(c){return '<i data-pc="'+c+'" style="background:'+c+'"></i>'}).join("")+'</div><canvas width="520" height="340"></canvas>',560,function(el){
